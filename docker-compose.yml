services:
  postgres:
    container_name: postgres
    image: postgres:14
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-admin}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - backend
    restart: unless-stopped


  config-server:
    build: ./configServer
    container_name: configServer
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: docker,native
    volumes:
      - ./configServer/src/main/resources/config:/config
    networks:
      - backend
    healthcheck:
      test: [ "CMD","wget","--spider","http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  service-discovery:
    build: ./eureka
    container_name: service-discovery
    ports:
      - "8761:8761"
    networks:
      - backend
    healthcheck:
      test: ["CMD","wget","--spider","http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - backend
    depends_on:
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD","wget","--spider","http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  date-service:
    build: ./dates
    container_name: date-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USER: ${POSTGRES_USERNAME:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    networks:
      - backend
    depends_on:
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD","wget","--spider","http://localhost:8081/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  client-service:
    build: ./clients
    container_name: client-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USER: ${POSTGRES_USERNAME:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    networks:
      - backend
    depends_on:
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD","wget","--spider","http://localhost:8082/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  barber-service:
    build: ./barbers
    container_name: barber-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USER: ${POSTGRES_USERNAME:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    networks:
      - backend
    depends_on:
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD","wget","--spider","http://localhost:8083/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  security-service:
    build: ./security
    container_name: security-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USER: ${POSTGRES_USERNAME:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    networks:
      - backend
    depends_on:
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD","wget","--spider","http://localhost:8084/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s



networks:
  backend:
    driver: bridge


volumes:
  postgres:
  pgadmin:
  config-server:
