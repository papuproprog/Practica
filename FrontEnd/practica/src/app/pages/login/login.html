<main class="grid min-h-screen lg:grid-cols-[43%_57%]">

    <aside class="relative hidden flex-col justify-between overflow-hidden bg-stone-900 p-8 text-white lg:flex">

      <header class="relative z-10 flex items-center gap-3">
      </header>

      <section class="relative z-10 max-w-md">
        No me dio iempo no se que poner aqui
      </section>

      <footer class="relative z-10 flex items-center gap-3 text-xs text-white/70">
      </footer>
    </aside>

    <section class="flex flex-col items-center justifyng /-center px-6 py-12">
      <div class="w-full max-w-[400px] rounded-2xl bg-white p-8 shadow-xl shadow-stone-900/10 ring-1 ring-black/5">

        <h2 class="mt-2 font-display text-3xl">Login:</h2>

        <form class="mt-6 space-y-5">

          <div>
            <label class="mb-2 block text-xs font-semibold">Correo electrónico</label>
            <div class="relative">
              
              <input
                type="email" required
                placeholder="Pon tu correo porfa"
                class="h-11 w-full rounded-lg border border-black/10 pl-5 pr-3 text-xs outline-none transition placeholder:text-tinta/40"
              />
            </div>
          </div>

          <div>
            <div class="mb-2 flex items-center justify-between">
              <label for="password" class="text-xs font-semibold">Contraseña</label>
            </div>
            <div class="relative">
          
              <input type="password" required
                class="h-11 w-full rounded-lg border border-black/10 pl-5 pr-10 text-xs outline-none transition"
              />
            </div>
          </div>

          <button
            type="submit"
            class="flex h-11 w-full items-center justify-center gap-2 rounded-lg bg-cyan-500 text-xs font-semibold  text-white transition hover:bg-cyan-700">
            Ingresar
          </button>
        </form>
      </div>

    </section>
  </main>
