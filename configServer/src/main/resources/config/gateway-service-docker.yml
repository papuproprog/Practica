server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - http://localhost:4200
                  - http://127.0.0.1:4200
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: '*'
                allowCredentials: true
          routes:
            - id: client-service
              uri: lb://CLIENT-SERVICE
              predicates:
                - Path=/api/clients/**

            - id: date-service
              uri: lb://DATE-SERVICE
              predicates:
                - Path=/api/dates/**

            - id: barber-service
              uri: lb://BARBER-SERVICE
              predicates:
                - Path=/api/barbers/**

            - id: security-service
              uri: lb://SECURITY-SERVICE
              predicates:
                - Path=/api/auth/**

            - id: eureka-server
              uri: http://service-discovery:8761
              predicates:
                - Path=/eureka/main
              filters:
                - SetPath=/

            - id: eureka-server-static
              uri: http://service-discovery:8761
              predicates:
                - Path=/eureka/**

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
